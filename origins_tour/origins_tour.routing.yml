origins_tour.help:
  path: '/origins/help'
  defaults:
    _title: 'Site help'
    _controller: '\Drupal\origins_tour\Controller\HelpPagesController'
  requirements:
    _role: 'authenticated'
  options:
    _admin_route: true
origins_tour.modal:
  path: '/origins-tour-modal'
  defaults:
    _controller: '\Drupal\origins_tour\Controller\OriginsTourDialogController::modal'
  requirements:
    _role: 'authenticated'
origins_tour.feedback_form:
  path: '/origins-tour/feedback'
  defaults:
    _form: '\Drupal\origins_tour\Form\FeedbackForm'
    _title: 'Feedback'
  requirements:
    _role: 'authenticated'
origins_tour.close_modal:
  path: '/origins-tour/close-modal'
  defaults:
    _controller: '\Drupal\origins_tour\Controller\OriginsTourDialogController::closeModal'
    _title: ''
  requirements:
    _role: 'authenticated'
