langcode: en
status: true
dependencies:
  enforced:
    module:
      - origins_tour
id: revisions
label: Revisions
routes:
  -
    route_name: entity.node.version_history
tips:
  revision_number:
    id: revision_number
    plugin: text
    label: 'Revision number'
    weight: -10
    position: top-start
    selector: '#edit-node-revisions-table > thead:nth-child(2) > tr:nth-child(1) > th:nth-child(1)'
    body: 'This column shows the revision number.'
  revision_information:
    id: revision_information
    plugin: text
    label: 'Revision information'
    weight: -10
    position: top-start
    selector: '#edit-node-revisions-table > thead:nth-child(2) > tr:nth-child(1) > th:nth-child(2)'
    body: 'This column shows information related to each revision.'
  compare_column_1:
    id: compare_column_1
    plugin: text
    label: 'Compare column 1'
    weight: -10
    position: top-start
    selector: '#edit-node-revisions-table > thead:nth-child(2) > tr:nth-child(1) > th:nth-child(3)'
    body: 'This column shows the first revision for comparison. Click a circle to select it; the currently selected revision is marked with a blue dot.'
  compare_column_2:
    id: compare_column_2
    plugin: text
    label: 'Compare column 2'
    weight: -10
    position: top-start
    selector: '#edit-node-revisions-table > thead:nth-child(2) > tr:nth-child(1) > th:nth-child(4)'
    body: 'This column shows the second revision for comparison. Click a circle to select it; the currently selected revision is marked with a blue dot.'
  operations:
    id: operations
    plugin: text
    label: Operations
    weight: -10
    position: top-start
    selector: '#edit-node-revisions-table > thead:nth-child(2) > tr:nth-child(1) > th:nth-child(5)'
    body: 'This column shows available operations on each revision. Click the dropdown arrow to view available operations.'
  compare_selected_revisions:
    id: compare_selected_revisions
    plugin: text
    label: 'Compare selected revisions'
    weight: -10
    position: right-start
    selector: '#edit-submit'
    body: 'When your revisions are selected and you have confirmed the blue dot is present on your revisions, click the blue "Compare selected revisions" button.'
