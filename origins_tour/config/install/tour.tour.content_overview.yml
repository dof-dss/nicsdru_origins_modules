langcode: en
status: true
dependencies:
  module:
    - tour_extras_wysiwyg
  enforced:
    module:
      - tour
      - tour_extras_wysiwyg
      - tour_extras_url_step
_core:
  default_config_hash: A0m3XSIsLtIHdFiE13yWHHl2seTlt-wNulpaj6qJTEQ
id: content_overview
label: 'Content overview'
routes:
  -
    route_name: system.admin_content
tips:
  add_content:
    id: add_content
    plugin: text_formatted
    label: 'Add content'
    weight: -100
    position: right
    selector: .button--primary
    body:
      value: '<p>Click this button to add content to the site.</p>'
      format: basic_html
  search:
    id: search
    plugin: text_formatted
    label: Search
    weight: -99
    position: top
    selector: .view-filters
    body:
      value: '<p>Use the search feature to find site content. Narrow results by applying one or more filters, type in the text boxes or select options from the dropdown lists. When you''re ready, click the grey <strong data-start="192" data-end="204">“Filter”</strong> button.</p>'
      format: basic_html
  table_headings:
    id: table_headings
    plugin: text_formatted
    label: 'Table headings'
    weight: -98
    position: top
    selector: .views-form__bulk-operations-row
    body:
      value: '<p>The content overview table lists the site’s content. The top row shows <strong data-start="113" data-end="125">headings</strong> like Title, Type, Author, etc. If a heading has a <strong data-start="176" data-end="191">sort symbol</strong>, click it to order the content by that column.</p>'
      format: basic_html
  operations:
    id: operations
    plugin: text_formatted
    label: Operations
    weight: -97
    position: top-start
    selector: .views-field-operations
    body:
      value: '<p>This column shows operations available for content items. Use the <strong>Edit</strong> feature or click a dropdown arrow to display available operations for each piece of content.</p>'
      format: basic_html
  bulk_individual_select:
    id: bulk_individual_select
    plugin: text_formatted
    label: 'Bulk/individual select'
    weight: -96
    position: top-start
    selector: .select-all
    body:
      value: '<p>Click the top box to select all content on the page. To select a single item, tick the box in the same row as that item. To perform an action on the selected item/s click the <strong data-start="152" data-end="164">“Select”</strong> field and click the blue <strong data-start="190" data-end="219">“Apply to selected items”</strong> button in the black box below.</p>'
      format: basic_html
