entity.origins_reporter_report.settings:
  path: 'admin/structure/origins-reporter-report'
  defaults:
    _form: '\Drupal\origins_reporter\Form\ReportSettingsForm'
    _title: 'Report'
  requirements:
    _permission: 'administer origins_reporter_report'
entity.origins_reporter_report.report_form:
  path: 'admin/origins-report-form'
  defaults:
    _form: '\Drupal\origins_reporter\Form\ReportForm'
    _title: 'Report'

origins_reporter.report_form:
  path: '/origins-reporter/report-form'
  defaults:
    _title: 'Report Form'
    _controller: '\Drupal\origins_reporter\Controller\OriginsReporterController'
  requirements:
    _permission: 'access content'
