entity.content_issue.settings:
  path: 'admin/structure/content-issue'
  defaults:
    _form: '\Drupal\origins_content_issue\Form\ContentIssueSettingsForm'
    _title: 'Content issue'
  requirements:
    _permission: 'administer content issue'

origins_content_issue.issue.add:
  path: '/origins/content-issue/add/{entity_id}/{revision_id}'
  defaults:
    _title: 'Create content issue'
    _controller: '\Drupal\origins_content_issue\Controller\ContentIssueController'
  requirements:
    _permission: 'create content issue'

origins_content_issue.issue.display:
  path: '/origins/content-issue/display/{entity_id}'
  defaults:
    _controller: '\Drupal\origins_content_issue\Controller\ContentIssueController::display'
  requirements:
    _permission: 'view content issue'

origins_content_issue.comment.add:
  path: '/content-issue-comment/add/{issue_id}'
  defaults:
    _title: 'Create content issue comment'
    _controller: '\Drupal\origins_content_issue\Controller\ContentIssueCommentController::addForm'
  requirements:
    _permission: 'create content issue'
