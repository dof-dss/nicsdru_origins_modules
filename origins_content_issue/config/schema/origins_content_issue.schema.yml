block.settings.origins_content_issue_users_content_issues:
  type: block_settings
  label: 'Users content issues block'
  mapping:
    example:
      type: string
      label: Example

# Schema for the configuration files of the Origins content issue module.
origins_content_issue.settings:
  type: config_object
  label: 'Origins content issue settings'
  mapping:
    report_icon:
      type: string
      label: 'Report icon'
    notify_on_create:
      type: boolean
      label: 'Notify content author on create.'
    notify_reporter:
      type: string
      label: 'Notify reporter on state change'
