origins_forms.forms_configuration:
  path: '/admin/config/origins/forms-settings'
  defaults:
    _title: 'Forms configuration'
    _form: 'Drupal\origins_forms\Form\FormsConfigurationForm'
  requirements:
    _permission: 'administer site configuration'
origins_forms.origins_exclude_title_form:
  path: '/admin/config/origins/forms-settings/exclude_title_form'
  defaults:
    _form: '\Drupal\origins_forms\Form\ExcludeTitleForm'
    _title: 'Origins Unique Title'
  requirements:
    _role: 'administrator'
  options:
    _admin_route: TRUE
